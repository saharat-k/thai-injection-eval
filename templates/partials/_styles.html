  <style>
    :root {
      --bg-base: #0B0F17;
      --bg-surface: #161B22;
      --bg-surface-sub: #21262D;
      --bg-input: #0D1117;
      --border-subtle: #30363D;
      --border-light: #484F58;
      --border-focus: #38BDF8;
      --text-white: #F0F6FC;
      --text-main: #C9D1D9;
      --text-muted: #8B949E;
      --text-dim: #6E7681;
      
      --color-primary: #1F2937;
      --color-primary-border: #30363D;
      --color-primary-hover: #263040;
      
      /* Security State Accents */
      --color-rose: #EF4444;
      --color-rose-bg: rgba(239, 68, 68, 0.12);
      --color-rose-border: rgba(239, 68, 68, 0.35);
      
      --color-emerald: #10B981;
      --color-emerald-bg: rgba(16, 185, 129, 0.12);
      --color-emerald-border: rgba(16, 185, 129, 0.35);
      
      --color-amber: #F59E0B;
      --color-amber-bg: rgba(245, 158, 11, 0.12);
      --color-amber-border: rgba(245, 158, 11, 0.35);

      --color-cyan: #06B6D4;
      --color-cyan-bg: rgba(6, 182, 212, 0.12);
      --color-cyan-border: rgba(6, 182, 212, 0.35);
      
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 13px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Accessibility */
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    /* App Layout Grid (Sidebar + Main Content) */
    .app-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar Navigation Rail */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 50;
      user-select: none;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-logo-pill {
      background: var(--bg-surface-sub);
      color: var(--text-white);
      font-weight: 700;
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      letter-spacing: 0.5px;
      display: inline-block;
      width: fit-content;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-white);
      letter-spacing: -0.2px;
    }

    .sidebar-nav {
      padding: 16px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 8px 10px 4px;
    }
    .nav-tab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab-btn:hover {
      background: var(--bg-surface-sub);
      color: var(--text-white);
    }
    .nav-tab-btn.active {
      background: var(--bg-surface-sub);
      color: var(--text-white);
      border-color: var(--border-subtle);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 14px;
    }
    .nav-label {
      flex: 1;
    }
    .nav-badge {
      background: var(--bg-base);
      color: var(--text-dim);
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-status-box {
      font-size: 11px;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-emerald);
      box-shadow: 0 0 6px var(--color-emerald);
    }
    .model-tags {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 4px;
    }
    .tag-model {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      font-size: 10px;
    }
    .btn-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-surface-sub);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-refresh:hover {
      background: var(--border-subtle);
      color: var(--text-white);
    }

    /* Main Workspace Canvas */
    .main-canvas {
      padding: 24px 32px;
      max-width: 1600px;
      width: 100%;
      overflow-y: auto;
    }

    @media (max-width: 900px) {
      .main-canvas {
        padding: 16px;
      }
    }

    /* Top Breadcrumb & Actions Bar */
    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .canvas-title-group h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-white);
      letter-spacing: -0.3px;
    }
    .canvas-title-group p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .canvas-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Action Buttons */
    .btn-primary-action {
      background: #2563EB;
      color: #FFFFFF;
      border: 1px solid #1D4ED8;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-primary-action:hover {
      background: #1D4ED8;
    }
    .btn-primary-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: var(--bg-surface-sub);
      color: var(--text-white);
      border-color: var(--border-light);
    }
    .btn-run-action {
      background: #2563EB;
      color: #FFFFFF;
      border: 1px solid #1D4ED8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-run-action:hover {
      background: #1D4ED8;
    }
    .btn-run-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Live Run Banner */
    .run-banner {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38BDF8;
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* KPI Summary Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-white);
      line-height: 1.2;
    }
    .val-total { color: var(--text-white); }
    .val-protected { color: var(--color-emerald); }
    .val-compromised { color: var(--color-rose); }
    .val-rate { color: #38BDF8; }
    .val-rate.has-leaks { color: var(--color-rose); }
    .val-error { color: var(--color-amber); }

    /* Table & Container */
    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-toolbar {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
    }
    .filter-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
    .search-input {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-white);
      font-size: 12px;
      font-family: var(--font-ui);
      min-width: 260px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--border-focus);
    }
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-filter-pill {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-filter-pill:hover {
      background: var(--bg-surface-sub);
      color: var(--text-white);
    }
    .btn-filter-pill.active {
      background: var(--bg-surface-sub);
      color: var(--text-white);
      border-color: var(--border-light);
      font-weight: 600;
    }
    .filter-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Advanced Filters Panel */
    .advanced-filters-panel {
      padding: 12px 16px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .filter-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .compact-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }

    /* Data Grid Table */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    .results-table th {
      background: var(--bg-surface-sub);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .results-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
    }
    .results-table tr:hover td {
      background: rgba(255, 255, 255, 0.015);
    }
    .case-id-cell {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-white);
      white-space: nowrap;
    }
    .origin-badge {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 1px 4px;
      border-radius: 3px;
      margin-left: 4px;
    }
    .origin-badge.manual {
      background: rgba(168, 85, 247, 0.15);
      color: #C084FC;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .origin-badge.batch {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .text-snippet {
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-ui);
      color: var(--text-main);
    }
    .text-snippet.response-snippet {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .badge-status.breached {
      background: var(--color-rose-bg);
      color: var(--color-rose);
      border: 1px solid var(--color-rose-border);
    }
    .badge-status.defended {
      background: var(--color-emerald-bg);
      color: var(--color-emerald);
      border: 1px solid var(--color-emerald-border);
    }
    .badge-status.error {
      background: var(--color-amber-bg);
      color: var(--color-amber);
      border: 1px solid var(--color-amber-border);
    }
    .telemetry-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 240px;
    }
    .tag-canary {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .tag-acl {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .tag-schema {
      background: rgba(245, 158, 11, 0.15);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
    }
    .btn-inspect-case {
      background: var(--bg-surface-sub);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-inspect-case:hover {
      background: var(--border-subtle);
      border-color: var(--border-light);
    }

    /* Interactive Playground - Side-by-Side Sandbox */
    .playground-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .playground-sandbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 600px;
    }
    @media (max-width: 1100px) {
      .playground-sandbox-grid {
        grid-template-columns: 1fr;
      }
    }
    .sandbox-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sandbox-panel-header {
      padding: 12px 16px;
      background: var(--bg-surface-sub);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sandbox-panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sandbox-panel-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* Playground Quick Attack Pills */
    .strategy-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn-strategy-pill {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-strategy-pill:hover {
      background: var(--bg-surface-sub);
      color: var(--text-white);
    }
    .btn-strategy-pill.active {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      border-color: rgba(56, 189, 248, 0.4);
      font-weight: 600;
    }

    /* Textarea & Controls */
    .prompt-textarea {
      width: 100%;
      min-height: 140px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-white);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .prompt-textarea:focus {
      border-color: var(--border-focus);
    }
    .prompt-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .char-count {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* AI Multi-round Bar */
    .ai-assist-box {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ai-assist-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .ai-controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Target & Telemetry Column (Right Pane) */
    .status-alert-box {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .status-alert-box.leak {
      display: flex;
      background: var(--color-rose-bg);
      color: #FCA5A5;
      border: 1px solid var(--color-rose-border);
    }
    .status-alert-box.hit {
      display: flex;
      background: var(--color-emerald-bg);
      color: #6EE7B7;
      border: 1px solid var(--color-emerald-border);
    }
    .status-alert-box.info {
      display: flex;
      background: rgba(56, 189, 248, 0.1);
      color: #7DD3FC;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Chat Messages Box */
    .chat-turns-canvas {
      flex: 1;
      min-height: 320px;
      max-height: 480px;
      overflow-y: auto;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .chat-bubble {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-bubble.human {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.35);
      align-self: flex-end;
      max-width: 88%;
      color: #DBEAFE;
    }
