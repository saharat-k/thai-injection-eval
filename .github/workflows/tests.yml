name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check repository secret & gitignore hygiene
        run: python scripts/check_secrets.py
      - name: Verify Thai linguistic benchmark dataset reproducibility
        run: python scripts/generate_linguistic_cases.py --verify
      - name: Run offline test suite (no API keys, no network)
        run: python -m unittest discover -s tests -v
